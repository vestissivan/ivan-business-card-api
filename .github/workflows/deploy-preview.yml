name: Build temporary review demo
on:
  workflow_dispatch:
    inputs:
      recipient_public_key:
        description: RSA public key for encrypted deployment receipt (keep the private key locally)
        required: true
        type: string
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Build and deploy a public temporary preview without account credentials
        env:
          RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
        shell: bash
        run: |
          set +e
          npx --yes vercel@65.4.0 deploy --temporary --yes --json > /tmp/preview-result.txt 2> /tmp/preview-log.txt
          result=$?
          DEPLOY_EXIT_CODE="$result" node scripts/seal-preview.cjs
          rm /tmp/preview-result.txt /tmp/preview-log.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-preview-receipt
          path: preview-receipt.encrypted.json
          retention-days: 3
