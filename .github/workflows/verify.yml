name: Verify API and Docker startup
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:check
      - run: npm test
      - run: docker build -t business-card .
      - name: Smoke test a fresh container and restart
        shell: bash
        run: |
          docker run -d --name card -p 3000:3000 business-card
          trap 'docker logs card; docker rm -f card' EXIT
          for n in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then break; fi
            sleep 2
          done
          node scripts/smoke-test.cjs
          docker restart card
          for n in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then break; fi
            sleep 2
          done
          node scripts/smoke-test.cjs
